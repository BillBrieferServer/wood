{% extends "base.html" %}

{% block title %}Admin Login — Hardwood Haven{% endblock %}

{% block content %}
<section class="section" style="max-width:400px; margin:80px auto; padding:0 20px;">
    <h1 style="text-align:center; margin-bottom:30px;">Admin Login</h1>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/admin" class="admin-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" required autofocus>
        <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>
</section>
{% endblock %}
