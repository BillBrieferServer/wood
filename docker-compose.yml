# Hardwood Haven of Idaho - FastAPI Stack
# Domain: wood.quietimpact.ai

services:
  app:
    build: .
    container_name: hardwood_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - ./data:/opt/hardwood-haven/data
      - ./app/static/images/products:/app/static/images/products
      - ./app/static/videos:/app/static/videos
    env_file: .env
    environment:
      - DB_PATH=/opt/hardwood-haven/data/hardwood.db
    labels:
      - "com.hardwoodhaven.stack=production"
